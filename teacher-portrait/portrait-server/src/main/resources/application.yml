server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/teacher_portrait?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectionCollation=utf8mb4_unicode_ci}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# ========== 应用自定义配置 ==========
app:
  upload:
    path: ${APP_UPLOAD_PATH:./uploads}
    max-size: 10485760
  mobile:
    default-page-size: 10
    max-page-size: 100

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  openapi:
    title: 教师数字画像系统API文档
    description: 教师数字画像系统接口文档
    version: 1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.portrait.controller
      mobile:
        group-name: 移动端API
        api-rule: package
        api-rule-resources:
          - com.portrait.controller.mobile

jwt:
  secret: ${JWT_SECRET:teacher-portrait-dev-secret-key-2026}
  expiration: 86400000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
